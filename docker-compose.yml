x-authon-service: &authon-service
  build:
    context: .
    dockerfile: Dockerfile
  platform: linux/arm64
  volumes:
    - .:/app
    - /app/node_modules
    - /app/.next
    - /app/.open-next

services:
  web:
    <<: *authon-service
    ports:
      - "3000:3000"
      - "8787:8787"
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    command: npm run dev

  ops:
    <<: *authon-service
    profiles:
      - ops
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      AUTHON_PRODUCTION_INTENT: ${AUTHON_PRODUCTION_INTENT:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
    command: node scripts/ops/require-production-intent.mjs
