services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    # Apple Silicon 호환성 문제 방지
    platform: linux/arm64
    ports:
      - "3000:3000"   # Next.js 개발 서버
      - "8787:8787"   # Wrangler Workers 미리보기 (npm run cf:preview)
    volumes:
      # 로컬 소스코드 실시간 동기화
      - .:/app
      # 컨테이너 내 node_modules / 빌드 산출물 격리 (로컬 바이너리 충돌 방지)
      - /app/node_modules
      - /app/.next
      - /app/.open-next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - NEXT_TELEMETRY_DISABLED=1
      # Cloudflare 인증 (배포/원격 마이그레이션 시 필요, .env에서 주입)
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
    command: npm run dev
    # 컨테이너 접속: docker compose run --rm web sh
    #
    # 주요 워크플로:
    #   개발 서버:           docker compose up
    #   Workers 미리보기:   docker compose run --rm web npm run cf:preview
    #   D1 마이그레이션:    docker compose run --rm web npm run db:migrate:local
    #   Workers 빌드:       docker compose run --rm web npm run build:worker
    #   Workers 배포:       docker compose run --rm web npm run deploy
