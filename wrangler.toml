name = "authon-worker"
main = ".open-next/worker.js"
compatibility_date = "2026-07-27"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

routes = [
  { pattern = "guest.faustseoul.kr", custom_domain = true }
]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# D1 데이터베이스 바인딩
[[d1_databases]]
binding = "DB"
database_name = "authon-db"
database_id = "b849dd4e-533e-477d-9ef8-cc2e4a00df1f"
migrations_dir = "migrations"

# KV 바인딩 - 세션 저장소
[[kv_namespaces]]
binding = "SESSIONS"
id = "c29d9d86856b41458a8112fb620ae874"
preview_id = "3c3c403d6dbb4aa7b0e8920041b12622"

# 비시크릿 환경 변수 (시크릿은 .dev.vars 또는 Cloudflare Dashboard에서 관리)
# JWT_SECRET, AWS_SES_* 등 시크릿은 .dev.vars에 설정 (절대 여기에 입력 금지)
[vars]
NEXT_PUBLIC_APP_URL = "https://guest.faustseoul.kr"
# 로컬 개발 URL은 .dev.vars의 NEXT_PUBLIC_APP_URL로 오버라이드:
#   NEXT_PUBLIC_APP_URL = "http://localhost:3000"
#   TERMINAL_VENUE_ID   = "<실제 베뉴 UUID>"
