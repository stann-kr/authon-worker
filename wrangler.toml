name = "authon-worker"
main = ".open-next/worker.js"
compatibility_date = "2026-07-27"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

routes = [
  { pattern = "guest.faustseoul.kr", custom_domain = true }
]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# D1 데이터베이스 바인딩
[[d1_databases]]
binding = "DB"
database_name = "authon-db"
database_id = "b849dd4e-533e-477d-9ef8-cc2e4a00df1f"
migrations_dir = "migrations"

# KV 바인딩 - 세션 저장소
[[kv_namespaces]]
binding = "SESSIONS"
id = "c29d9d86856b41458a8112fb620ae874"
preview_id = "3c3c403d6dbb4aa7b0e8920041b12622"

# 비시크릿 환경 변수 (시크릿은 .dev.vars 또는 Cloudflare Dashboard에서 관리)
# JWT_SECRET, AWS_SES_* 등 시크릿은 .dev.vars에 설정 (절대 여기에 입력 금지)
[vars]
NEXT_PUBLIC_APP_URL = "https://guest.faustseoul.kr"
# 외부 connector는 공식 API 접근 및 서면 허가를 모두 확인한 항목만
# OFFICIAL_CONNECTORS_JSON으로 별도 설정한다. 기본값은 미설정(fail-closed)이다.
# 로컬 개발 URL은 .dev.vars의 NEXT_PUBLIC_APP_URL로 오버라이드:
#   NEXT_PUBLIC_APP_URL = "http://localhost:3000"
#   TERMINAL_VENUE_ID   = "<실제 베뉴 UUID>"

[env.dev]
name = "authon-worker-dev"
workers_dev = true
preview_urls = false
routes = []

[[env.dev.d1_databases]]
binding = "DB"
# Development Worker는 실제 운영 데이터 검증을 위해 production D1을 공유한다.
# 이 binding의 모든 application write는 production data에 즉시 반영된다.
database_name = "authon-db"
database_id = "b849dd4e-533e-477d-9ef8-cc2e4a00df1f"
migrations_dir = "migrations"

[[env.dev.kv_namespaces]]
binding = "SESSIONS"
id = "a30736e015524e47985bf5407ff10db3"

[env.dev.vars]
NEXT_PUBLIC_APP_URL = "https://authon-worker-dev.ilsny7.workers.dev"
